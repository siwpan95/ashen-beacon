# 《灰烬信标》工程清单 —— dse-core 的插件 + allin-engine 的桥。
#
# 前四个是 dse 内核（scenes/state/io/engine），最后一个是自定义插件：
# name 写「模块.类名」，由 sdk._resolve_plugin 动态 import，
# 它会把 allin-engine 的战斗/角色/背包/谜题接进来。

- id: scenes
  config:
    packs:
      - ./content/beacon.yml    # 第一批：主线与结局
      - ./content/wasteland.yml # 第二批：外圈区域（水站 / 中继站 / 地下室 / 书库 / 电台室）

- id: state
  config:
    initial:
      name: 柯岚
      # allin.* 全部由 bridge.AllinBridge.pull() 每步覆写；
      # 这里预置只是为了让条件表达式在首帧就有定义（否则会刷 未定义 告警）。
      allin:
        # 只预置内容真正会读的键；pct/hurt/alive/floor/bagSize/cards/lastRoll
        # 全仓零引用，已从 pull() 与这里一并清掉。
        hp: 0
        maxHp: 0
        locales: 0
        ok: false
        rollLine: ''
        skill: 侦察
        dc: 10
        item: {}
        tech: {}
        # 谜题通关标记必须逐个预置成 false：@restart 会把 state 复位到 initial，
        # 而成就插件在 pull() 之前就求值，这一刻 allin.solved.bunker_terminal
        # 是未定义的 —— 战败重开时会刷两条「条件求值失败」告警。
        solved:
          bunker_terminal: false
          relay_fuse: false
          camp_dilemma: false
        # 信号强度：pull() 每步覆写，但复位的那一瞬要先有定义，
        # 否则内容里的 allin.signal >= 6 同样会刷告警。
        signal: 0
      roadTrips: 0
      # 累积变量（调研要点：用一个计数代替一堆布尔）
      cred: 0
      # 经营插件的状态键：不预置的话，成就里写 tradeProfit > 0 会每次求值刷告警
      gold: 0
      tradeProfit: 0
      tradeDay: 0
      stock: {}
      flags:
        dogDown: false
        raiderDown: false
        watcherDown: false
        vetDown: false
        campTold: false
        wounded: false
        threwRock: false
        sawCamera: false
        sawNest: false
        looting: false
        # 第二批：道德困境与两难的后果标记（终章文本会据此变化）
        savedCamp: false
        strippedPump: false
        relayFixed: false
        heardTape: false
        answeredCall: false
        handedKid: false
        freedKid: false
        walkedAway: false
        sparedRaider: false
        knowsHer: false
        marketCredited: false
      onceSeen: []

# IO 换成 project 侧的加固子类：内置 ConsoleIO 的 ask() 只 catch EOFError，
# 碰到非 UTF-8 输入（中文 Windows 终端发 GBK）会抛 UnicodeDecodeError，
# 一路冒到 engine.start 的兜底，把整局游戏中止掉。详见 console_safe.py。
- id: io
  name: console_safe.SafeConsoleIO

- id: engine
  config:
    entry: prologue
    prompt: '> '
    maxHistory: 60

# 对话模式（内置插件）：mode: dialogue 的场景由它接管，ask <话题> / topics / end
- id: dialogue

# 经营：南边营地的三日集。商品与行情日程写死 —— 确定性优先，可复现、可算计。
# 行 = 商品（顺序同 goods），列 = 第 1..3 天的卖出价。
- id: trade
  config:
    place: 南边营地 · 三日集
    goods:
      water: { name: 净水,  buy: 8 }
      ration: { name: 口粮, buy: 10 }
      meds:  { name: 药,   buy: 20 }
      parts: { name: 零件, buy: 14 }
    schedule:
      - [10, 14, 9]     # 净水：第二天车队来，涨
      - [11, 9, 12]     # 口粮：第二天便宜，第三天涨
      - [24, 18, 26]    # 药：第二天有人贱卖，第三天贵得离谱
      - [15, 15, 19]    # 零件：第三天有人收货

- id: achievements
  config:
    list:
      - id: first-blood
        name: 第一次见血
        desc: 放倒了一个活人
        when: 'flags.raiderDown'
      - id: lockbreaker
        name: 手艺人
        desc: 撬开了 B-3 值班终端的口令
        when: 'allin.solved.bunker_terminal'
      - id: lumen
        name: 关灯的人
        desc: 放倒了守望者 RM-07
        when: 'flags.watcherDown'
      - id: roadtripper
        name: 走得够远
        desc: 到过 12 处以上的地方
        when: 'allin.locales >= 12'
      # —— 第二批 ——
      - id: plumber
        name: 水来了
        desc: 接好了净水站那台烧掉的电机
        when: 'flags.savedCamp'
      - id: lineman
        name: 线路工
        desc: 修好了中继站的配电盘，把天线拆了下来
        when: 'flags.relayFixed'
      - id: operator
        name: 收到
        desc: 对着三十年的电台，回了一句「收到」
        when: 'flags.answeredCall'
      - id: dealer
        name: 会算账
        desc: 三日集收市时没赔
        when: 'tradeProfit > 0'
      - id: antenna
        name: 攒齐了
        desc: 身上凑出了能传很远的一套东西
        when: 'allin.signal >= 6'
      - id: arbiter
        name: 做过决定
        desc: 营地丢药那件事，你选了一边
        when: 'flags.handedKid or flags.freedKid or flags.walkedAway'
      - id: veteran
        name: 二层上的人
        desc: 放倒了守着电台的老兵
        when: 'flags.vetDown'

- id: bridge
  name: bridge.AllinBridge
